<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oratorio Rosta</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oratorio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F3F4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Stesso colore dello sfondo dell'app: la barra di stato (ora, batteria) si unisce all'app */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F6F3F4; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .manca { font-family: -apple-system, system-ui, sans-serif; color: #1D1D1F; text-align: center; padding: 48px 24px; line-height: 1.4; }
</style>
</head>
<body>
<script>
  // ⬇️ Il link della tua app (quello che finisce con /exec)
  const LINK_APP = 'https://script.google.com/macros/s/AKfycbwr_UxQrmRtvqblk54-aLUf9qciBOz8LKYyh0OcJx09h3de0gBviUzR0CnRkW23yN61/exec';

  if (LINK_APP.indexOf('https://script.google.com/') !== 0) {
    document.body.innerHTML = '<p class="manca">Manca il link dell’app.<br>Apri index.html e incollalo al posto di INCOLLA_QUI_IL_LINK.</p>';
  } else {
    const pagina = document.createElement('iframe');
    pagina.src = LINK_APP;
    pagina.title = 'Oratorio Rosta';
    document.body.appendChild(pagina);
  }

  // L'app chiede di scurire la barra di stato quando apre un foglio (Nuova iscrizione, Modifica)
  const COLORI = { chiaro: '#F6F3F4', scuro: '#000000' };
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.oratorio !== 'colore' || !COLORI[d.valore]) return;
    if (!/(^|\.)(google\.com|googleusercontent\.com)$/.test(new URL(e.origin).hostname)) return;
    const c = COLORI[d.valore];
    document.documentElement.style.background = c;
    document.body.style.background = c;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
  });
</script>
</body>
</html>
